<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Подбор автозапчастей по номеру и производителю</title>
    <meta name="description" content="Найдите производителей по номеру детали и подберите аналоги: цены, остатки и сроки отгрузки со складов." />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- VITE_SITE_URL подставляется Vite при сборке; задаётся на хостинге, без слэша на конце -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Подбор автозапчастей" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="Подбор автозапчастей по номеру и производителю" />
    <meta property="og:description" content="Найдите производителей по номеру детали и подберите аналоги: цены, остатки и сроки отгрузки со складов." />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Подбор автозапчастей" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Подбор автозапчастей по номеру и производителю" />
    <meta name="twitter:description" content="Найдите производителей по номеру детали и подберите аналоги: цены, остатки и сроки отгрузки со складов." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
    <!-- Ключ 'theme' дублирует THEME_STORAGE_KEY из src/utils/constants.js -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-bs-theme', theme);
        } catch (e) {
          /* private mode / blocked storage */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
